<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>checklist</title>
    <link rel="stylesheet" href="/brand.css" />
    <link rel="stylesheet" href="../_shared/base.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card" id="card">
      <section class="body" id="body">
        <div class="intro">
          <div class="count" id="count"></div>
          <h1 class="headline" id="headline"></h1>
        </div>
        <ol class="list" id="list"></ol>
      </section>
    </main>
    <script type="module">
      import { D, $, el, frame, segs, finish } from "../_shared/runtime.js";
      frame();
      segs($("#headline"), D.headline);
      const items = D.lines.slice(0, 8);
      $("#count").textContent = `${String(items.length).padStart(2, "0")} items`;
      items.forEach((line, i) => {
        const li = el("li", "item");
        li.append(el("span", "idx", String(i + 1).padStart(2, "0")), segs(el("span", "txt"), line), el("span", "box"));
        $("#list").append(li);
      });
      finish(() => [{ name: "body", region: $("#body"), min: 0.4 }]);
    </script>
  </body>
</html>
