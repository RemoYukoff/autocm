<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autocm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8eaed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <button class="btn icon-btn" id="pause-btn" type="button" hidden></button>
      <div class="acct" id="acct">
        <button class="acct-btn" id="acct-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="acct-menu" title="Choose the account to show"><span class="acct-label"><span class="acct-name">Loading…</span></span></button>
        <div class="acct-menu" id="acct-menu" role="menu" aria-label="Accounts" hidden></div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
    </div>
  </header>

  <main>
    <section class="no-accounts" id="no-accounts" hidden>
      <h1 class="view-title">No accounts yet</h1>
      <p class="lede">Add an X account: log in to it, then give the website of the product it posts about.</p>
      <button type="button" class="btn btn-primary" data-add-account>+ Add account</button>
    </section>
    <div class="setup" id="setup" hidden></div>
    <section id="view-day" class="view" hidden>
      <nav class="days" id="days" aria-label="Days"></nav>
      <div class="view-head">
        <h1 class="view-title"><span id="view-title">Today</span> <span class="count" id="count"></span></h1>
      </div>
      <p class="lede" id="lede"></p>
      <ol class="timeline" id="slots"></ol>
      <p class="empty" id="empty" hidden></p>
      <div class="gen" id="gen" hidden>
        <button class="gen-main" id="gen-btn" type="button" title="The marketer picks text, image or video">+ Generate post</button>
        <button class="gen-more" id="gen-more" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="gen-menu" aria-label="Choose the type of post"><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="gen-menu" id="gen-menu" role="menu" aria-label="Type of post" hidden>
          <button type="button" class="gen-item" role="menuitem" data-gen-format="text"><b>Text</b><span>Words only</span></button>
          <button type="button" class="gen-item" role="menuitem" data-gen-format="image"><b>Image</b><span>A designed picture</span></button>
          <button type="button" class="gen-item" role="menuitem" data-gen-format="video"><b>Video</b><span>A short clip</span></button>
        </div>
      </div>
    </section>
  </main>

  <dialog class="confirm" id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 class="confirm-title" id="confirm-title"></h2>
      <p class="confirm-body" id="confirm-body"></p>
      <div class="confirm-actions">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn btn-primary" id="confirm-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <dialog class="lightbox" id="lightbox" aria-label="Image">
    <img id="lightbox-img" alt="">
  </dialog>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
