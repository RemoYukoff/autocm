<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>autocm</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8eaed'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">autocm</span>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="top-actions">
        <button class="btn" id="pause-btn" type="button"></button>
      </div>
    </div>
    <div class="quotas" id="quotas"></div>
  </header>

  <main>
    <section id="view-upcoming" class="view">
      <h1 class="view-title">Up next <span class="count" id="count-upcoming"></span></h1>
      <p class="lede" id="lede-upcoming">Posts publish automatically at their time unless you discard them.</p>
      <ol class="timeline" id="upcoming"></ol>
      <p class="empty" id="upcoming-empty" hidden>Nothing planned. The scheduler plans each day at 00:05 UTC.</p>
    </section>
  </main>

  <div class="toasts" id="toasts" aria-live="assertive"></div>
  <script src="/app.js" type="module"></script>
</body>
</html>
